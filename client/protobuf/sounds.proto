syntax = "proto2";

package tibia.protobuf.sound;

import "sounds-common.proto";

message Sounds {
  repeated tibia.protobuf.sound.Sound sound = 1;
  repeated tibia.protobuf.sound.NumericSoundEffect numeric_sound_effect = 2;
  repeated tibia.protobuf.sound.AmbienceStream ambience_stream = 3;
  repeated tibia.protobuf.sound.AmbienceObjectStream ambience_object_stream = 4;
  repeated tibia.protobuf.sound.MusicTemplate music_template = 5;
}

message Sound {
  optional uint32 id = 1;
  optional string filename = 2;
  optional string original_filename = 3;
  optional bool is_stream = 4;
}

message NumericSoundEffect {
  oneof numericsoundeffect_oneof {
    tibia.protobuf.sound.SimpleSoundEffect simple_sound_effect = 5;
    tibia.protobuf.sound.RandomSoundEffect random_sound_effect = 6;
  }
  optional uint32 id = 1;
  optional tibia.protobuf.sound.ENumericSoundType numeric_sound_type = 2;
  optional tibia.protobuf.sound.MinMaxFloat random_pitch = 3;
  optional tibia.protobuf.sound.MinMaxFloat random_volume = 4;
}

message AmbienceStream {
  optional uint32 id = 1;
  optional uint32 looping_sound_id = 2;
  repeated tibia.protobuf.sound.DelayedSoundEffect delayed_effects = 3;
}

message AmbienceObjectStream {
  optional uint32 id = 1;
  repeated uint32 counted_appearance_types = 2;
  repeated tibia.protobuf.sound.AppearanceTypesCountSoundEffect sound_effects = 3;
  optional uint32 max_sound_distance = 4;
}

message MusicTemplate {
  optional uint32 id = 1;
  optional uint32 sound_id = 2;
  optional tibia.protobuf.sound.EMusicType music_type = 3;
}
